name: Build IrChip8

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: irchip8-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: IrChip8-Windows-x64
          - os: ubuntu-latest
            artifact: IrChip8-Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux SDL dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libasound2-dev libpulse-dev libfribidi-dev libjack-dev \
            libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
            libthai-dev libusb-1.0-0-dev libpipewire-0.3-dev libwayland-dev \
            libdecor-0-dev liburing-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DIRCHIP8_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install UPX on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v5.2.0/upx-5.2.0-win64.zip" -OutFile upx.zip
          Expand-Archive upx.zip -DestinationPath upx
          $upxDir = (Get-ChildItem upx -Directory | Select-Object -First 1).FullName
          $upxDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install UPX on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -L "https://github.com/upx/upx/releases/download/v5.2.0/upx-5.2.0-amd64_linux.tar.xz" -o upx.tar.xz
          tar -xf upx.tar.xz
          sudo install -m 0755 upx-5.2.0-amd64_linux/upx /usr/local/bin/upx

      - name: Pack Windows executable with UPX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          upx --best --lzma build/Release/IrChip8.exe
          upx -t build/Release/IrChip8.exe

      - name: Pack Linux executable with UPX
        if: runner.os == 'Linux'
        shell: bash
        run: |
          upx --best --lzma build/IrChip8
          upx -t build/IrChip8

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/IrChip8.exe dist/IrChip8.exe
          Copy-Item README.md dist/README.md
          Copy-Item LICENSE dist/LICENSE
          "IrChip8 v1.2.0`nSDL3 desktop build`nUPX 5.2.0 --best --lzma" | Set-Content dist/BUILD-INFO.txt
          Compress-Archive -Path dist/* -DestinationPath IrChip8-Windows-x64.zip -Force

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp build/IrChip8 dist/IrChip8
          cp README.md LICENSE dist/
          printf 'IrChip8 v1.2.0\nSDL3 desktop build\nUPX 5.2.0 --best --lzma\n' > dist/BUILD-INFO.txt
          chmod +x dist/IrChip8
          tar -C dist -czf IrChip8-Linux-x64.tar.gz .

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: IrChip8-Windows-x64.zip
          if-no-files-found: error

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: IrChip8-Linux-x64.tar.gz
          if-no-files-found: error

  webassembly:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:6.0.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SDL3 WebAssembly
        shell: bash
        run: |
          emcmake cmake -S . -B build-web \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DIRCHIP8_BUILD_APP=OFF \
            -DIRCHIP8_BUILD_TESTS=OFF \
            -DIRCHIP8_BUILD_WEB=ON

      - name: Build hosted and standalone web targets
        shell: bash
        run: cmake --build build-web --parallel

      - name: Optimize hosted WebAssembly
        shell: bash
        run: |
          /emsdk/upstream/bin/wasm-opt build-web/index.wasm \
            -Oz --all-features --strip-debug --strip-producers \
            -o build-web/index.optimized.wasm
          mv build-web/index.optimized.wasm build-web/index.wasm

      - name: Verify web outputs
        shell: bash
        run: |
          test -s build-web/index.html
          test -s build-web/index.js
          test -s build-web/index.wasm
          test -s build-web/IrChip8-Standalone.html
          node --check build-web/index.js
          grep -q "Choose .ch8" build-web/index.html
          grep -q "Run" build-web/IrChip8-Standalone.html
          ls -lh build-web/index.html build-web/index.js build-web/index.wasm build-web/IrChip8-Standalone.html

      - name: Package WebAssembly release
        shell: bash
        run: |
          mkdir -p dist-web
          cp build-web/index.html build-web/index.js build-web/index.wasm dist-web/
          cp build-web/IrChip8-Standalone.html dist-web/
          cp README.md LICENSE dist-web/
          printf 'IrChip8 v1.2.0\nSDL3 + Emscripten WebAssembly\nindex.html = hosted build\nIrChip8-Standalone.html = self-contained local launcher\n' > dist-web/BUILD-INFO.txt
          gzip -9 -k dist-web/index.js
          gzip -9 -k dist-web/index.wasm
          python3 -m zipfile -c IrChip8-WebAssembly.zip dist-web/*

      - name: Upload WebAssembly artifact
        uses: actions/upload-artifact@v4
        with:
          name: IrChip8-WebAssembly
          path: IrChip8-WebAssembly.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native, webassembly]
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged builds
        uses: actions/download-artifact@v4
        with:
          pattern: IrChip8-*
          path: release-assets
          merge-multiple: true

      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'NOTES'
          # IrChip8 v1.2.0

          SDL3-based CHIP-8 / CHIP-48 / Super-CHIP emulator for Windows, Linux and WebAssembly.

          Highlights:
          - Native Windows/Linux SDL3 builds compressed with UPX 5.2.0 and verified with `upx -t`.
          - Browser runtime now uses SDL3 directly from C++ instead of a JavaScript-rendered emulator loop.
          - Web package includes normal `index.html + index.js + index.wasm` hosting files.
          - Web package also includes `IrChip8-Standalone.html`, a self-contained launcher with embedded WebAssembly for easy local opening.
          - `.ch8` picker and drag/drop, explicit Run/Pause/Reset controls, keyboard and gamepad support.
          - Heuristic CHIP-8 / CHIP-48 / Super-CHIP ROM detection with manual profile override.
          - Core unit tests and cross-platform CI remain enabled.

          ROMs are not bundled. Use ROMs you are allowed to run.
          NOTES

      - name: Create GitHub Release v1.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v1.2.0 \
            release-assets/IrChip8-Windows-x64.zip \
            release-assets/IrChip8-Linux-x64.tar.gz \
            release-assets/IrChip8-WebAssembly.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "IrChip8 v1.2.0 — SDL3 WebAssembly" \
            --notes-file RELEASE_NOTES.md
